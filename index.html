<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BreachBall</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#070a14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BreachBall" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #070a14; color: #22d3ee; font: 12vw Bungee, Impact, sans-serif; text-transform: uppercase; }
      @keyframes defence-pulse { 40% { transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .defence-pulse { animation: none !important; } }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">BreachBall</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
